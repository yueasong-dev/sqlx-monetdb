[package]
name = "sqlx-monetdb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Async, pure-Rust MAPI protocol client for MonetDB"
homepage = "https://github.com/yueasong-dev/sqlx-monetdb"
repository = "https://github.com/yueasong-dev/sqlx-monetdb"
readme = "README.md"
keywords = ["database", "sql", "monetdb", "sqlx", "async"]
categories = ["database"]

[dependencies]
sqlx-core = { version = "0.9.0", default-features = false }
log = "0.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
ripemd = "0.2.0"
hex = "0.4.3"
rust_decimal = "1.42.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-core = { version = "0.3.32", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["alloc"] }

[features]
default = []
runtime-tokio = ["sqlx-core/_rt-tokio"]
runtime-async-std = ["sqlx-core/_rt-async-std"]
runtime-smol = ["sqlx-core/_rt-smol"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
